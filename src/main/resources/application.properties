spring.application.name=backend

jwt.secret.key=${JWT_SECRET}
# milliseconds
jwt.expiration=${JWT_EXPIRATION}
# milliseconds
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}

app.rate-limit.poi-create.capacity=5
app.rate-limit.poi-create.period-hours=24
app.poi.check.radius-meters=50

gh.url=${GH_URL:http://localhost:8989}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/walk}
spring.datasource.username=${DB_USERNAME:walk}
spring.datasource.password=${DB_PASSWORD:walk}

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.initialization-fail-timeout=0
spring.main.lazy-initialization=true

springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs
# ?????????? ?????????? ? UI
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Coil
app.base-url=${APP_BASE_URL}
app.upload.dir=${UPLOAD_DIR}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Flyway configuration
#spring.flyway.enabled=true
#spring.flyway.locations=classpath:db/migration
#spring.flyway.baseline-on-migrate=true